name: Android CD (Google Play Store)
on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. Base64로 저장된 키스토어를 다시 파일(.jks)로 복구
      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release-keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. 버전 설정
      - name: Determine Version Name
        id: version_logic
        run: |
          BASE_VERSION=$(grep -oP 'val baseVersion\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.2.0")
          
          VERSION_CODE_OFFSET=100
          FINAL_VERSION_CODE=$((VERSION_CODE_OFFSET + ${{ github.run_number }}))
          
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            FINAL_VERSION=${GITHUB_REF#refs/tags/}
            TRACK="alpha"
          
          else
            FINAL_VERSION="v${BASE_VERSION}-dev.${FINAL_VERSION_CODE}"
            TRACK="internal"
          fi
          
          echo "final_version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "version_code=$FINAL_VERSION_CODE" >> $GITHUB_OUTPUT

      # 3. 배포용 AAB 빌드 (서명 포함)
      - name: Build Release Bundle with Versioning
        run: >
          ./gradlew bundleRelease
          -PversionCode=${{ steps.version_logic.outputs.version_code }}
          -PversionName=${{ steps.version_logic.outputs.final_version }}
          -Pandroid.injected.signing.store.file=app/release-keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonRaw: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.zcard.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.version_logic.outputs.track }}

          
          
      
